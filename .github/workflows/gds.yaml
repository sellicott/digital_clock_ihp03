name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download GDS artifact
      uses: actions/download-artifact@v7
      with:
        name: tt_submission

    - name: Set up environment variables
      shell: bash
      run: |
        # Defaults
        PDK=$(jq -r '.PDK' pdk.json)
        PDK_ROOT=/home/runner/pdk
        PDK_SOURCE=$(jq -r '.PDK_SOURCE' pdk.json)
        PDK_VERSION=$(jq -r '.PDK_VERSION' pdk.json)

        cat << __EOF >> $GITHUB_ENV
        PDK=$PDK
        PDK_ROOT=$PDK_ROOT
        PDK_SOURCE=$PDK_SOURCE
        PDK_VERSION=$PDK_VERSION
        __EOF

    - name: Install ${{ env.PDK }} PDK (ciel)
      if: ${{ env.PDK != 'ihp-sg13cmos5l' }}
      uses: TinyTapeout/ciel-action@v1
      with:
        pdk_name: ${{ env.PDK }}
        pdk_version: ${{ env.PDK_VERSION }}
        pdk_root: ${{ env.PDK_ROOT }}

    - name: Install ihp-sg13cmos5l PDK
      if: ${{ env.PDK == 'ihp-sg13cmos5l' }}
      shell: bash
      run: ${{ github.action_path }}/../install_sg13cmos5l.sh

    # Set Python up and install cocotb
    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install cocotb (if required)
      if: ${{ hashFiles('test/requirements.txt') == '' }}
      shell: bash
      run: pip install cocotb==1.8.0

    - name: Install Python packages
      if: ${{ hashFiles('test/requirements.txt') != '' }}
      shell: bash
      run: pip install -r test/requirements.txt

    - name: Install iverilog
      shell: bash
      run: |
        wget https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
        sudo apt-get update -y
        sudo apt-get install -y ./iverilog_13.0-1_amd64.deb

    - name: Run tests
      shell: bash
      run: |
        cp tt_submission/*.v "test/gate_level_netlist.v"
        cd "test"
        rm -f tb.vcd results.xml
        make -f makefile.gl clean
        GATES=yes make -f makefile.gl
        test -f results.xml
        ! grep failure results.xml

    - name: Upload VCD
      if: always()
      uses: actions/upload-artifact@v7
      with:
          name: gatelevel_test_vcd
          path: |
            test/tb.vcd
            test/results.xml

    - name: Test Summary
      if: always()
      uses: test-summary/action@v2.4
      with:
        paths: test/results.xml

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
